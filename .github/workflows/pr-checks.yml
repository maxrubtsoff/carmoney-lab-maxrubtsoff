name: PR checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Проверить синтаксис PHP
        run: find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: test
    runs-on: ubuntu-latest
    # Feature-тесты (tests/Feature) ходят в настоящую MySQL через
    # Database::connect() - в docker-compose это хост "db", в CI поднимаем
    # тем же образом, что и db в docker-compose.yml, но сервисом Actions.
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carmoney_lab
          MYSQL_USER: lab
          MYSQL_PASSWORD: lab
          MYSQL_ROOT_PASSWORD: lab-root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ulab -plab" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql
          tools: composer:v2

      - name: Кэш зависимостей Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Установить зависимости
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Накатить схему и сиды БД
        run: |
          mysql -h127.0.0.1 -P3306 -ulab -plab carmoney_lab < db/schema.sql
          mysql -h127.0.0.1 -P3306 -ulab -plab carmoney_lab < db/seed.sql

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=never
        env:
          DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=carmoney_lab;charset=utf8mb4"
          DB_USER: lab
          DB_PASSWORD: lab

  # Агентское ревью подключается в дне 3 (3.17): там job становится обязательным
  # гейтом. Пока это заготовка-советчик: падение не блокирует PR.
  ai-review:
    name: ai-review
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Заготовка агентского ревью
        run: |
          echo "ai-review пока не настроен."
          echo "День 3, 3.17: сюда добавляется вызов агента-ревьюера."
          echo "Ключ берётся из secrets.OPENROUTER_API_KEY_CI, комментарий в PR — через GITHUB_TOKEN."
          echo "Файлы в диффе:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD || true
